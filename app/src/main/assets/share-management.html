<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>共有管理 - 365Cloud</title>
    <link rel="icon" type="image/png" href="/365Cloud/365Cloud_Mainicon.png">
    <link rel="apple-touch-icon" href="/365Cloud/365Cloud_Mainicon.png">
    <link rel="shortcut icon" href="/365Cloud/365Cloud_Mainicon.png">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-header: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent: #3b82f6;
            --border: #334155;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 20px;
        }
        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        }
        .particle {
            position: absolute;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            animation: particle-fall 20s linear infinite;
            box-shadow: 0 0 8px rgba(255,255,255,0.6);
        }
        .shooting-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 12px 4px #60a5fa;
            animation: shooting-star 4s linear infinite;
        }
        @keyframes particle-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @keyframes shooting-star {
            0% { transform: translateX(-100vw) translateY(-100vh); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(150vw) translateY(150vh); opacity: 0; }
        }
        .header {
            background-color: var(--bg-header);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title h1 {
            font-size: 1.55em;
            font-weight: 600;
        }
        .header-title h2 {
            font-size: 1.1em;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 4px;
        }
        .back-button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 0.95em;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .main-content {
            padding: 20px 16px;
            max-width: 100%;
        }
        .page-title {
            font-size: 1.75em;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .page-description {
            color: var(--text-secondary);
            font-size: 1em;
            margin-bottom: 24px;
        }
        .controls {
            margin-bottom: 20px;
        }
        .controls button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05em;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        #share-list-container {
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 620px;
        }
        thead {
            background-color: #0f172a;
        }
        th {
            padding: 14px 8px;
            text-align: left;
            font-weight: 500;
            font-size: 0.85em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 14px 8px;
            font-size: 0.95em;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .file-name {
            font-weight: 500;
            color: var(--text-primary);
        }
        .link-cell {
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .link-cell a {
            color: var(--accent);
            text-decoration: none;
        }
        .operation-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 110px;
        }
        .operation-buttons button {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9em;
            border: none;
            font-weight: 500;
        }
        .btn-edit {
            background-color: #64748b;
            color: white;
        }
        .btn-delete {
            background-color: #ef4444;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15,23,42,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background-color: #1e293b;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }
        .close-button {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 28px;
            color: #94a3b8;
            cursor: pointer;
            line-height: 1;
        }
        .modal h2 {
            font-size: 1.45em;
            margin-bottom: 12px;
        }
        .modal p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 1em;
        }
        .share-protection-options {
            margin-bottom: 24px;
        }
        .option-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .option-row:last-child {
            border-bottom: none;
        }
        input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
        }
        label {
            font-size: 1.05em;
            flex: 1;
            cursor: pointer;
        }
        .input-container {
            margin-left: 32px;
            margin-top: 8px;
        }
        .input-container input {
            width: 100%;
            padding: 14px;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 10px;
            color: white;
            font-size: 1em;
        }
        .modal-error-message {
            color: #ef4444;
            font-size: 0.95em;
            margin-bottom: 16px;
            min-height: 1.2em;
        }
        .modal button {
            width: 100%;
            padding: 16px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 12px;
            border: none;
        }
        .btn-approve {
            background-color: #22c55e;
            color: white;
        }
        #message-modal .modal-content {
            text-align: center;
        }
        #message-modal h3 {
            font-size: 1.3em;
            margin-bottom: 16px;
        }
        #message-modal p {
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 3.5em;
            margin-bottom: 16px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="particles-container">
        <div class="particle" style="left:10%; width:6px; height:6px; animation-duration:18s;"></div>
        <div class="particle" style="left:25%; width:4px; height:4px; animation-duration:25s;"></div>
        <div class="particle" style="left:38%; width:8px; height:8px; animation-duration:14s;"></div>
        <div class="particle" style="left:45%; width:3px; height:3px; animation-duration:22s;"></div>
        <div class="particle" style="left:55%; width:7px; height:7px; animation-duration:17s;"></div>
        <div class="particle" style="left:68%; width:5px; height:5px; animation-duration:28s;"></div>
        <div class="particle" style="left:80%; width:4px; height:4px; animation-duration:19s;"></div>
        <div class="particle" style="left:92%; width:6px; height:6px; animation-duration:23s;"></div>
        <div class="shooting-star" style="top:15%; animation-delay:0s;"></div>
        <div class="shooting-star" style="top:35%; animation-delay:1.2s;"></div>
        <div class="shooting-star" style="top:55%; animation-delay:2.8s;"></div>
        <div class="shooting-star" style="top:22%; animation-delay:4.1s;"></div>
        <div class="shooting-star" style="top:68%; animation-delay:0.7s;"></div>
    </div>

    <div class="header">
        <div class="header-title">
            <h1>365Cloud</h1>
            <h2>共有管理</h2>
        </div>
        <a href="/365Cloud/index.html" class="back-button">
            ファイル管理に戻る
        </a>
    </div>

    <div class="main-content">
        <h1 class="page-title">共有リンク一覧</h1>
        <p class="page-description">あなたが作成した共有リンクの一覧です。</p>

        <div class="controls">
            <button id="refresh-shares" class="btn btn-info">一覧を更新</button>
        </div>

        <div id="share-list-container">
            <table>
                <thead>
                    <tr>
                        <th>ファイル名</th>
                        <th>作成日時</th>
                        <th>保護設定</th>
                        <th>リンク</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="share-list-body">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Share Modal -->
    <div id="edit-share-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-edit-modal-button">×</span>
            <h2>共有設定の編集</h2>
            <p id="edit-modal-filename"></p>

            <div class="share-protection-options">
                <div class="option-row">
                    <input type="radio" id="edit-protect-none" name="edit-protection" value="none">
                    <label for="edit-protect-none">保護なし</label>
                </div>

                <div class="option-row">
                    <input type="radio" id="edit-protect-pin" name="edit-protection" value="pin">
                    <label for="edit-protect-pin">PINコードで保護</label>
                </div>
                <div id="edit-pin-input-container" class="input-container" style="display: none;">
                    <input type="text" id="edit-share-pin-input" placeholder="4〜6桁の数字" maxlength="6">
                </div>

                <div class="option-row">
                    <input type="radio" id="edit-protect-password" name="edit-protection" value="password">
                    <label for="edit-protect-password">パスワードで保護</label>
                </div>
                <div id="edit-password-input-container" class="input-container" style="display: none;">
                    <input type="password" id="edit-share-password-input" placeholder="8文字以上">
                </div>
            </div>
            
            <p class="modal-error-message" id="edit-modal-error"></p>

            <button id="save-share-changes-button" class="btn btn-approve">変更を保存</button>
        </div>
    </div>

    <div id="message-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-message-modal-button">×</span>
            <h3 id="message-modal-title">お知らせ</h3>
            <p id="message-modal-text"></p>
            <button id="message-modal-ok-button">OK</button>
        </div>
    </div>

    <script src="share-management.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function updateCopyButtons() {
                document.querySelectorAll('.operation-buttons button').forEach(function(btn) {
                    if (btn.textContent.trim() === 'リンクを開く') {
                        btn.textContent = 'リンクをコピー';
                        btn.addEventListener('click', function(e) {
                            const row = this.closest('tr');
                            if (!row) return;
                            const linkElement = row.querySelector('.link-cell a');
                            if (linkElement && linkElement.href) {
                                navigator.clipboard.writeText(linkElement.href).then(function() {
                                    const modal = document.getElementById('message-modal');
                                    document.getElementById('message-modal-title').textContent = '成功';
                                    document.getElementById('message-modal-text').textContent = 'リンクをコピーしました';
                                    modal.style.display = 'flex';
                                });
                            }
                        });
                    }
                });
            }
            updateCopyButtons();
            const observer = new MutationObserver(updateCopyButtons);
            observer.observe(document.getElementById('share-list-body'), { childList: true, subtree: true });
        });
    </script>
</body>
</html>
