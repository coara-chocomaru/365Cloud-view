<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー設定 - 365Cloud</title>
    <link rel="stylesheet" href="365Cloud.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/365Cloud/365Cloud_Mainicon.png">
    <link rel="apple-touch-icon" href="/365Cloud/365Cloud_Mainicon.png">
    <link rel="shortcut icon" href="/365Cloud/365Cloud_Mainicon.png">
    <style>
        :root {
            --bg-color-body: #f8fafc;
            --bg-color-app: #ffffff;
            --bg-color-main: #f1f5f9;
            --bg-color-sidebar: #e2e8f0;
            --bg-color-action-section: #cbd5e1;
            --bg-color-file-item: #e2e8f0;
            --accent-color: #3b82f6;
            --accent-color-dark-theme: #60a5fa;
            --text-color-primary: #0f172a;
            --text-color-secondary: #334155;
            --text-color-heading: #0f172a;
            --text-color-message-success: #16a34a;
            --text-color-message-error: #dc2626;
            --border-color-primary: #cbd5e1;
            --border-color-secondary: #cbd5e1;
            --button-bg-primary: #3b82f6;
            --button-bg-secondary: #475569;
            --card-bg-color: var(--bg-color-app);
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --card-border-color: var(--border-color-secondary);
            --input-bg-color: var(--bg-color-main);
            --nav-bg-color: var(--bg-color-sidebar);
            --nav-link-hover-bg: var(--bg-color-action-section);
            --nav-link-active-bg: var(--accent-color);
        }

        body.dark-mode {
            --bg-color-body: #0f172a;
            --bg-color-app: #1e293b;
            --bg-color-main: #1e293b;
            --bg-color-sidebar: #111827;
            --bg-color-action-section: #1f2937;
            --bg-color-file-item: #334155;
            --accent-color: #3b82f6;
            --accent-color-dark-theme: #60a5fa;
            --text-color-primary: #f8fafc;
            --text-color-secondary: #cbd5e1;
            --text-color-heading: #f8fafc;
            --text-color-message-success: #4ade80;
            --text-color-message-error: #f87171;
            --border-color-primary: #334155;
            --border-color-secondary: #334155;
            --button-bg-primary: #3b82f6;
            --button-bg-secondary: #334155;
            --card-bg-color: var(--bg-color-app);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --card-border-color: #334155;
            --input-bg-color: var(--bg-color-file-item);
            --nav-bg-color: #1e293b;
            --nav-link-hover-bg: #2a3649;
            --nav-link-active-bg: var(--accent-color-dark-theme);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            display: block;
            min-height: 100vh;
            height: auto;
            overflow: hidden;
            background-color: var(--bg-color-body);
            color: var(--text-color-primary);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        a {
            color: inherit;
        }

        .settings-header {
            padding: 20px 24px;
            background-color: var(--nav-bg-color);
            border-bottom: 1px solid var(--card-border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .settings-header h1 {
            font-size: 1.8em;
            margin: 0;
            font-weight: 700;
        }

        .btn,
        .btn-primary,
        .btn-secondary,
        .back-button {
            appearance: none;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            padding: 12px 24px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: filter 0.15s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .btn:hover,
        .btn-primary:hover,
        .btn-secondary:hover,
        .back-button:hover {
            filter: brightness(1.05);
        }

        .btn:disabled,
        .btn-primary:disabled,
        .btn-secondary:disabled,
        .back-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn {
            background-color: var(--button-bg-secondary);
            color: white;
        }

        .btn-primary {
            background-color: var(--button-bg-primary);
            color: white;
        }

        .btn-secondary {
            background-color: #2a3b4d;
            border: 1px solid #4a5b6d;
            color: white;
        }

        .back-button {
            background-color: #334155;
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .settings-layout {
            display: flex;
            height: calc(100vh - 81px);
            min-height: calc(100vh - 81px);
        }

        .settings-nav {
            width: 240px;
            background-color: var(--nav-bg-color);
            padding: 20px;
            border-right: 1px solid var(--card-border-color);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .settings-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .settings-nav li a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: var(--text-color-primary);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 5px;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
        }

        .settings-nav li a .fa-fw {
            width: 20px;
        }

        .settings-nav li a:hover {
            background-color: var(--nav-link-hover-bg);
        }

        .settings-nav li a.active {
            background-color: var(--button-bg-primary);
            color: white;
        }

        .nav-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--card-border-color);
        }

        .nav-footer .btn,
        .nav-footer .btn-secondary {
            width: 100%;
            box-sizing: border-box;
        }

        .settings-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .settings-section {
            display: none;
        }

        .settings-section.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-description {
            margin-top: -15px;
            margin-bottom: 25px;
            color: var(--text-color-secondary);
        }

        .card {
            background-color: var(--card-bg-color);
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            border: 1px solid var(--card-border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .card h2 {
            color: var(--text-color-heading);
            border-bottom: 1px solid var(--border-color-secondary);
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color-secondary);
        }

        input[type="text"],
        input[type="password"],
        input[type="file"] {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg-color);
            color: var(--text-color-primary);
            border: 1px solid var(--border-color-primary);
            border-radius: 10px;
            font-size: 1em;
        }

        input[type="file"] {
            padding: 12px 14px;
        }

        input:focus-visible,
        .btn:focus-visible,
        .btn-primary:focus-visible,
        .btn-secondary:focus-visible,
        .back-button:focus-visible,
        .settings-nav li a:focus-visible,
        .close-button:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        #message {
            text-align: center;
            margin: 12px 16px 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            word-break: break-word;
            font-weight: 600;
        }

        #message.success {
            background-color: rgba(40, 167, 69, 0.2);
            color: var(--text-color-message-success);
            display: block;
        }

        #message.error {
            background-color: rgba(220, 53, 69, 0.2);
            color: var(--text-color-message-error);
            display: block;
        }

        .avatar-preview-container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        #avatar-preview {
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-color-primary);
            background-color: var(--bg-color-body);
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .username-form-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .username-form-group label {
            flex-shrink: 0;
            margin-bottom: 0;
        }

        .username-form-group input {
            flex-grow: 1;
            min-width: 180px;
            max-width: 250px;
        }

        .username-form-group button {
            flex-shrink: 0;
        }

        .history-table-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color-primary);
            border-radius: 8px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th,
        .history-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color-primary);
        }

        .history-table th {
            background-color: var(--input-bg-color);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .history-table tr:last-child td {
            border-bottom: none;
        }

        .status-indicator {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .status-indicator.enabled {
            background-color: rgba(40, 167, 69, 0.3);
            color: #20c997;
        }

        .status-indicator.disabled {
            background-color: rgba(108, 117, 125, 0.3);
            color: #adb5bd;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg-color);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 24px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border-color);
        }

        .close-button {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 30px;
            color: #94a3b8;
            cursor: pointer;
            line-height: 1;
        }

        .modal h2 {
            font-size: 1.45em;
            margin-bottom: 16px;
        }

        .form-group button {
            width: 100%;
            padding: 14px;
            font-size: 1.05em;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            margin-top: 8px;
        }

        section#appearance.settings-section {
            display: none;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .settings-layout {
                flex-direction: column;
                height: auto;
                min-height: auto;
            }

            .settings-nav {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--card-border-color);
            }

            .settings-content {
                overflow: visible;
                padding: 20px 16px 28px;
            }

            .nav-footer {
                display: none;
            }
        }

        @media (max-width: 640px) {
            .settings-header {
                padding: 16px;
            }

            .settings-header h1 {
                font-size: 1.45em;
            }

            .settings-content {
                padding: 16px;
            }

            .card {
                padding: 18px;
            }

            .username-form-group input {
                max-width: 100%;
            }

            .username-form-group button,
            .form-group button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="settings-header">
        <h1>ユーザー設定</h1>
        <a href="/365Cloud/index.html" class="back-button">ファイル管理に戻る</a>
    </div>

    <div id="message" aria-live="polite"></div>

    <div class="settings-layout">
        <nav class="settings-nav">
            <ul>
                <li><a href="#profile" class="active"><i class="fas fa-user-circle fa-fw"></i> プロフィール</a></li>
                <li><a href="#security"><i class="fas fa-shield-alt fa-fw"></i> セキュリティ</a></li>
                <li><a href="#login-history"><i class="fas fa-history fa-fw"></i> ログイン履歴</a></li>
                <li><a href="#appearance"><i class="fas fa-palette fa-fw"></i> 表示設定</a></li>
            </ul>
            <div class="nav-footer">
                <a href="/365Cloud/index.html" class="btn btn-secondary">ファイル一覧に戻る</a>
            </div>
        </nav>

        <main class="settings-content">
            <section id="profile" class="settings-section active">
                <h2>プロフィール設定</h2>
                <p class="section-description">あなたの公開プロフィール情報とアバターを管理します。</p>
                <div class="card">
                    <div class="form-group username-form-group">
                        <label for="username-input">ユーザー名</label>
                        <input type="text" id="username-input" value="" maxlength="10" autocomplete="nickname" spellcheck="false">
                        <button id="save-username-button" type="button" class="btn btn-primary">変更を保存</button>
                    </div>
                    <div class="form-group avatar-preview-container">
                        <img id="avatar-preview" src="/365Cloud/api/user/avatar" alt="現在のアバター" width="80" height="80">
                        <div style="min-width: 220px; flex: 1;">
                            <label for="avatar-upload">アイコン画像を変更</label>
                            <input type="file" id="avatar-upload" accept="image/png, image/jpeg, image/gif">
                            <button id="upload-avatar-button" type="button" class="btn" style="margin-top: 10px;">アップロード</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="security" class="settings-section">
                <h2>セキュリティ設定</h2>
                <p class="section-description">パスワードの変更と二要素認証（2FA）でアカウントを保護します。</p>
                <div class="card">
                    <div class="form-group">
                        <label>パスワード</label>
                        <button id="open-password-modal" type="button" class="btn">パスワードを変更</button>
                    </div>
                    <div class="form-group">
                        <label>二要素認証 (2FA)</label>
                        <div>
                            <p style="margin: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                ステータス: <span id="2fa-status"></span>
                                <button id="toggle-2fa-button" type="button" class="btn btn-secondary"></button>
                            </p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="login-history" class="settings-section">
                <h2>ログイン履歴</h2>
                <p class="section-description">あなたのアカウントへの最近のログインアクティビティを確認します。</p>
                <div class="card">
                    <div id="login-history-container" class="history-table-container">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>日時</th>
                                    <th>IPアドレス</th>
                                </tr>
                            </thead>
                            <tbody id="login-history-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="appearance" class="settings-section" style="display: none;">
                <h2>表示設定</h2>
                <p class="section-description">サイトの見た目をカスタマイズします。</p>
                <div class="card">
                    <div class="form-group">
                        <label>テーマ</label>
                        <button id="dark-mode-toggle" type="button" class="btn">ライトモードに切り替え</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="password-modal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
            <span class="close-button" id="close-password-modal" aria-label="閉じる">&times;</span>
            <h2 id="password-modal-title">パスワード変更</h2>
            <form id="password-change-form">
                <div class="form-group">
                    <label for="current-password">現在のパスワード</label>
                    <input type="password" id="current-password" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="new-password">新しいパスワード (8文字以上)</label>
                    <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">新しいパスワード（確認）</label>
                    <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">変更を保存</button>
            </form>
        </div>
    </div>

    <script src="settings.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('.settings-nav ul a');
            const sections = document.querySelectorAll('.settings-section');

            const activateSection = (hash) => {
                const targetHash = hash || '#profile';
                navLinks.forEach(link => {
                    link.classList.toggle('active', link.hash === targetHash);
                });
                sections.forEach(section => {
                    section.classList.toggle('active', section.id === targetHash.substring(1));
                });
            };

            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.hash = link.hash;
                    activateSection(link.hash);
                });
            });

            window.addEventListener('hashchange', () => {
                activateSection(window.location.hash);
            });

            activateSection(window.location.hash);
        });
    </script>
</body>
</html>
